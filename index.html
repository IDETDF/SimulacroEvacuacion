<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f95716" />
  <link rel="manifest" href="manifest.json" />
  <title>Simulacro Tsunami Ushuaia | DGOT</title>
  <link rel="stylesheet" href="lib/maplibre-gl.css" />
  <script src="lib/maplibre-gl.js"></script>
  <script src="lib/pmtiles.js"></script>
  <script src="lib/turf.min.js"></script>
  <style>
    :root {
      --dgot-orange: #f95716;
      --dgot-orange-dark: #d8430b;
      --bg-dark: #0b131e;
      --surface-card: rgba(17, 27, 39, 0.95);
      --border-color: rgba(255, 255, 255, 0.14);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; }

    /* Barra Superior */
    .top-bar {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 20;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .header-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .badge-dgot {
      pointer-events: auto;
      background: linear-gradient(135deg, var(--dgot-orange) 0%, var(--dgot-orange-dark) 100%);
      color: #fff; padding: 6px 14px; border-radius: 9999px; font-weight: 700; font-size: 12px;
      box-shadow: 0 4px 14px rgba(249, 87, 22, 0.35); text-transform: uppercase;
    }

    /* Alerta Dinámica */
    .alert-banner {
      pointer-events: auto; width: 100%; padding: 10px 14px; border-radius: 12px;
      font-size: 13px; font-weight: 700; text-align: center;
      backdrop-filter: blur(8px); box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease;
      display: none;
    }
    .alert-danger { background: rgba(255, 46, 34, 0.94); color: #ffffff; animation: pulse 1.8s infinite; }
    .alert-warning { background: rgba(255, 219, 0, 0.94); color: #000000; }
    .alert-safe { background: rgba(46, 125, 50, 0.94); color: #ffffff; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

    /* Panel Árbol de Capas Idéntico a QGIS */
    .layer-control {
      position: absolute; top: 60px; right: 12px; z-index: 25;
      background: var(--surface-card); border-radius: 14px;
      border: 1px solid var(--border-color); box-shadow: 0 8px 24px rgba(0,0,0,0.55);
      backdrop-filter: blur(10px); width: 265px; overflow: hidden;
      font-size: 12px;
    }
    .layer-header {
      padding: 10px 14px; font-weight: 700; display: flex;
      justify-content: space-between; align-items: center; cursor: pointer;
      background: rgba(255,255,255,0.06); border-bottom: 1px solid var(--border-color);
    }
    .layer-body {
      padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
      max-height: 68vh; overflow-y: auto;
    }
    .group-title {
      font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      color: var(--dgot-orange); margin-top: 6px; padding-bottom: 2px;
      border-bottom: 1px solid rgba(255,255,255,0.08); letter-spacing: 0.4px;
    }
    .layer-item {
      display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
      color: var(--text-main); padding: 1px 0;
    }
    .layer-item input { accent-color: var(--dgot-orange); width: 14px; height: 14px; cursor: pointer; }

    /* Modal de Inicio */
    #loader-overlay {
      position: absolute; inset: 0; z-index: 50;
      background: radial-gradient(circle at center, #162436 0%, #080d14 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 24px; text-align: center;
    }
    .card {
      background: var(--surface-card); border-radius: 20px; padding: 32px 24px;
      max-width: 420px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
      border: 1px solid rgba(249, 87, 22, 0.4); backdrop-filter: blur(12px);
    }
    .card img.logo-modal {
      width: 84px; height: 84px; object-fit: contain; margin: 0 auto 16px; display: block;
      border-radius: 18px; box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
    .file-btn {
      display: inline-block; width: 100%; padding: 14px 20px;
      background: linear-gradient(135deg, var(--dgot-orange) 0%, var(--dgot-orange-dark) 100%);
      color: #fff; font-weight: 600; font-size: 15px; border-radius: 12px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(249, 87, 22, 0.35); border: none;
    }
    .btn-install { background: #1e293b; color: #f8fafc; margin-bottom: 12px; display: none; border: 1px solid var(--border-color); }
    input[type="file"] { display: none; }
    .offline-tip { margin-top: 18px; font-size: 12px; color: #64748b; line-height: 1.4; }

    /* Popups */
    .maplibregl-popup-content {
      background: var(--surface-card) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color);
      border-radius: 10px; padding: 12px 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .maplibregl-popup-close-button { color: var(--text-muted); padding: 4px; }
  </style>
</head>
<body>

  <div id="loader-overlay">
    <div class="card">
      <img src="icon-192.png" alt="DGOT" class="logo-modal" />
      <h1 style="font-size: 20px; margin-bottom: 8px;">Simulacro Tsunami Ushuaia</h1>
      <p style="color: var(--text-muted); font-size: 13.5px; line-height: 1.5; margin-bottom: 20px;">
        Cargando mapas...
      </p>

      <button id="btn-install" class="file-btn btn-install">📲 Instalar App en el Teléfono</button>

      <div id="loader-status" class="offline-tip" style="margin-top: 18px; font-size: 13px; color: var(--text-muted);"></div>
    </div>
  </div>

  <div class="top-bar">
    <div class="header-row">
      <div class="badge-dgot">DGOT · Ushuaia</div>
      <div id="gps-status" style="background: var(--surface-card); color: var(--text-muted); padding: 4px 10px; border-radius: 9999px; font-size: 11px; border: 1px solid var(--border-color); backdrop-filter: blur(8px); pointer-events: auto;">
        GPS: Esperando
      </div>
    </div>
    <div id="alert-box" class="alert-banner"></div>
  </div>

  <!-- Árbol de Capas Organizado como en QGIS -->
  <div class="layer-control">
    <div class="layer-header" onclick="toggleLayerList()">
      <span>📑 Capas del Proyecto</span>
      <span id="chevron">▼</span>
    </div>
    <div class="layer-body" id="layer-list">
      
      <div class="group-title">Recorte y Etiquetas</div>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['zona-recorte-mascara', 'zona-recorte-borde'], this.checked)"> 🔲 Zona del recorte</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['lbl-comando', 'lbl-hidro-rios', 'lbl-hidro-lagunas', 'lbl-calles', 'lbl-ciencia'], this.checked)"> 🏷️ Etiquetas del Mapa</label>

      <div class="group-title">Nuevo Simulacro</div>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['lyr-escaleras'], this.checked)"> 🟦 Escaleras</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['vias-evacuacion', 'vias-evacuacion-flechas'], this.checked)"> ➡️ Vías de evacuación</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['cota-segura-fondo', 'cota-segura'], this.checked)"> 🟩 Línea Zona Segura</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['comando-puntos', 'lbl-comando'], this.checked)"> 🔴 Posibles Centros Comando</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['via-sanitaria-borde', 'via-sanitaria', 'via-sanitaria-flechas'], this.checked)"> 🟥 Vía Sanitaria</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['contorno-simulacro-borde', 'contorno-simulacro'], this.checked)"> ⬛ Polígono Contorno</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['puntos-reunion-dc', 'puntos-reunion-escuelas'], this.checked)"> ✴️ Puntos de Encuentro</label>

      <div class="group-title">Calles y Puentes</div>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['puentes-solido', 'puentes-peatonal'], this.checked)"> 🟥 Puentes</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['calles-blanco', 'calles-borde', 'lbl-calles'], this.checked)"> ⚪ Calles</label>

      <div class="group-title">Población Vulnerable</div>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['vulnerable-puntos'], this.checked)"> 🏠 Población Vulnerable</label>

      <div class="group-title">Equipamientos</div>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['salud-publica-puntos'], this.checked)"> ➕ Centros Públicos Salud</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['salud-privada-puntos'], this.checked)"> 🏥 Centros Privados Salud</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['legislativo-puntos'], this.checked)"> 🏛️ Poder Legislativo</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['bomberos-puntos'], this.checked)"> 🔥 Cuartel de Bomberos</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['seguridad-puntos'], this.checked)"> ✵ Edificio de Seguridad</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['deportes-puntos'], this.checked)"> ⚽ Instalaciones Deportivas</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['ciencia-puntos', 'lbl-ciencia'], this.checked)"> 📘 Ciencia y Educación</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['escuelas-puntos'], this.checked)"> 🎓 Instituciones Educativas</label>

      <div class="group-title">Infraestructura</div>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['combustible-puntos'], this.checked)"> ⛽ Estación de Servicios</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['potabilizadora-puntos'], this.checked)"> 🚰 Planta Potabilizadora</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['antenas-puntos'], this.checked)"> 🗼 Antenas</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['electrogeno-puntos'], this.checked)"> ⚡ Grupo Electrógeno</label>

      <div class="group-title">Hidrografía y Base</div>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['area-evacuacion-colores'], this.checked)"> ⚠️ Área Evacuación</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['arroyos-lineas', 'lbl-hidro-rios'], this.checked)"> 💧 Corriente de agua</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['espejos-agua-fill', 'lbl-hidro-lagunas'], this.checked)"> 🟦 Espejo de agua</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['humedales-fill'], this.checked)"> 🟫 Humedales</label>
      <label class="layer-item"><input type="checkbox" checked onchange="toggleLayers(['lyr-satelite'], this.checked)"> 🛰️ ESRI Satellite (B/N)</label>

    </div>
  </div>

  <div id="map"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').then(r => r.update()));
    }

    let deferredPrompt = null;
    const btnInstall = document.getElementById('btn-install');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'block';
    });
    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt = null;
      btnInstall.style.display = 'none';
    });

    let map = null;
    const alertBox = document.getElementById('alert-box');
    const gpsStatus = document.getElementById('gps-status');

    function toggleLayerList() {
      const list = document.getElementById('layer-list');
      const chev = document.getElementById('chevron');
      const isClosed = list.style.display === 'none';
      list.style.display = isClosed ? 'flex' : 'none';
      chev.innerText = isClosed ? '▼' : '▲';
    }

    function toggleLayers(layerIds, visible) {
      if (!map) return;
      layerIds.forEach(id => {
        if (map.getLayer(id)) {
          map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
        }
      });
    }

    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile);

    const CACHE_NAME = 'dgot-tiles-v1';

    async function cargarPmtiles(url, nombre, etiqueta) {
      const status = document.getElementById('loader-status');
      const cache = await caches.open(CACHE_NAME);
      let blob;

      const cacheada = await cache.match(url);
      if (cacheada) {
        blob = await cacheada.blob();
      } else {
        status.textContent = `Descargando ${etiqueta}...`;
        const respuesta = await fetch(url);
        if (!respuesta.ok) throw new Error(`no se pudo obtener ${nombre} (HTTP ${respuesta.status})`);
        try {
          await cache.put(url, respuesta.clone());
        } catch (err) {
          console.warn('No se pudo guardar en caché:', err);
        }
        blob = await respuesta.blob();
      }

      const file = new File([blob], nombre);
      protocol.add(new pmtiles.PMTiles(new pmtiles.FileSource(file)));
    }

    (async () => {
      const overlay = document.getElementById('loader-overlay');
      const status = document.getElementById('loader-status');

      try {
        await cargarPmtiles('./capas_operativas.pmtiles', 'capas_operativas.pmtiles', 'capas operativas');
        await cargarPmtiles('./fondo_satelital.pmtiles', 'fondo_satelital.pmtiles', 'fondo satelital');
      } catch (err) {
        status.textContent = `Error: ${err.message}. Conectate una vez para descargar los mapas.`;
        return;
      }
      overlay.style.display = 'none';

      const ushuaiaBounds = [
        [-68.3800, -54.8550],
        [-68.2400, -54.7700]
      ];

      map = new maplibregl.Map({
        container: 'map',
        center: [-68.3050, -54.8080],
        zoom: 14,
        minZoom: 11,
        maxZoom: 19,
        maxBounds: ushuaiaBounds,
        style: {
          version: 8,
          glyphs: "./fonts/{fontstack}/{range}.pbf",
          sprite: "./sprite/sprite",
          sources: {
            "satelite_source": {
              type: "raster",
              url: "pmtiles://fondo_satelital.pmtiles",
              tileSize: 256
            },
            "tsunami_vector": {
              type: "vector",
              url: "pmtiles://capas_operativas.pmtiles"
            },
            "ruta_activa": {
              type: "geojson",
              data: { type: "FeatureCollection", features: [] }
            }
          },
          layers: [
            // 0. Fondo
            { id: "background", type: "background", paint: { "background-color": "#383838" } },

            // 1. Satélite B/N
            {
              id: "lyr-satelite",
              source: "satelite_source",
              type: "raster",
              paint: {
                "raster-saturation": -1,
                "raster-contrast": 0.15,
                "raster-brightness-max": 0.95
              }
            },

            // 2. Humedales
            {
              id: "humedales-fill",
              source: "tsunami_vector",
              "source-layer": "humedalesgeojson",
              type: "fill",
              paint: {
                "fill-color": "#d9b982",
                "fill-opacity": 0.35,
                "fill-outline-color": "#b48a4e"
              }
            },

            // 3. Espejos de agua
            {
              id: "espejos-agua-fill",
              source: "tsunami_vector",
              "source-layer": "espejos_aguageojson",
              type: "fill",
              paint: {
                "fill-color": "#bae6fd",
                "fill-opacity": 0.75,
                "fill-outline-color": "#0284c7"
              }
            },

            // 4. Área de Evacuación por Categorías (Alto=Rojo, Medio=Amarillo, Bajo=Verde)
            {
              id: "area-evacuacion-colores",
              source: "tsunami_vector",
              "source-layer": "zonas_riesgogeojson",
              type: "fill",
              paint: {
                "fill-color": [
                  "match",
                  ["get", "categoria"],
                  "Alto", "rgb(255, 46, 34)",
                  "Medio", "rgb(255, 219, 0)",
                  "Bajo", "rgb(104, 215, 20)",
                  "rgba(255, 46, 34, 0.4)"
                ],
                "fill-opacity": 0.42
              }
            },

            // 5. Corrientes de agua
            {
              id: "arroyos-lineas",
              source: "tsunami_vector",
              "source-layer": "arroyosgeojson",
              type: "line",
              paint: { "line-color": "#00b4d8", "line-width": 2.4 }
            },

            // 6. Calles - Blanco
            {
              id: "calles-borde",
              source: "tsunami_vector",
              "source-layer": "callesgeojson",
              type: "line",
              paint: {
                "line-color": "#404040",
                "line-width": [
                  "match", ["get", "fna"],
                  "AVENIDA", 4.5, "RUTA NACIONAL", 5.0, "SECUNDARIA", 3.6, 2.6
                ]
              }
            },
            {
              id: "calles-blanco",
              source: "tsunami_vector",
              "source-layer": "callesgeojson",
              type: "line",
              paint: {
                "line-color": "#ffffff",
                "line-width": [
                  "match", ["get", "fna"],
                  "AVENIDA", 2.6, "RUTA NACIONAL", 3.0, "SECUNDARIA", 2.0, 1.4
                ],
                "line-opacity": 0.9
              }
            },

            // 7. PUENTES CLASIFICADOS
            {
              id: "puentes-solido",
              source: "tsunami_vector",
              "source-layer": "puentesgeojson",
              type: "line",
              filter: ["==", ["coalesce", ["get", "gna"], ["get", "fna"], ""], "PUENTE"],
              paint: { "line-color": "#dc2626", "line-width": 5.5 }
            },
            {
              id: "puentes-peatonal",
              source: "tsunami_vector",
              "source-layer": "puentesgeojson",
              type: "line",
              filter: ["!=", ["coalesce", ["get", "gna"], ["get", "fna"], ""], "PUENTE"],
              paint: { "line-color": "#dc2626", "line-width": 4.0, "line-dasharray": [2, 1.5] }
            },

            // 8. POLIGONO_NUEVO_CONTORNO
            {
              id: "contorno-simulacro-borde",
              source: "tsunami_vector",
              "source-layer": "poligono_contornogeojson",
              type: "line",
              paint: { "line-color": "#000000", "line-width": 5.0 }
            },
            {
              id: "contorno-simulacro",
              source: "tsunami_vector",
              "source-layer": "poligono_contornogeojson",
              type: "line",
              paint: { "line-color": "#ffffff", "line-width": 2.0, "line-dasharray": [3, 2] }
            },

            // 9. Línea Zona Segura
            {
              id: "cota-segura-fondo",
              source: "tsunami_vector",
              "source-layer": "cota_segurageojson",
              type: "line",
              paint: { "line-color": "#ffffff", "line-width": 6.0, "line-opacity": 0.85 }
            },
            {
              id: "cota-segura",
              source: "tsunami_vector",
              "source-layer": "cota_segurageojson",
              type: "line",
              paint: { "line-color": "#16a34a", "line-width": 4.2 }
            },

            // 10. Escaleras
            {
              id: "lyr-escaleras",
              source: "tsunami_vector",
              "source-layer": "escalerasgeojson",
              type: "line",
              paint: { "line-color": "#1d4ed8", "line-width": 3.5, "line-dasharray": [1.5, 1.5] }
            },

            // 11. Vías de evacuación
            {
              id: "vias-evacuacion",
              source: "tsunami_vector",
              "source-layer": "vias_evacuaciongeojson",
              type: "line",
              paint: { "line-color": "#0033ff", "line-width": 4.5 }
            },
            {
              id: "vias-evacuacion-flechas",
              source: "tsunami_vector",
              "source-layer": "vias_evacuaciongeojson",
              type: "symbol",
              layout: {
                "symbol-placement": "line",
                "symbol-spacing": 70,
                "icon-image": "flecha_azul",
                "icon-size": 0.65,
                "icon-allow-overlap": true,
                "icon-ignore-placement": true
              }
            },

            // 12. Vía Sanitaria
            {
              id: "via-sanitaria-borde",
              source: "tsunami_vector",
              "source-layer": "via_sanitariageojson",
              type: "line",
              paint: { "line-color": "#ffffff", "line-width": 6.5 }
            },
            {
              id: "via-sanitaria",
              source: "tsunami_vector",
              "source-layer": "via_sanitariageojson",
              type: "line",
              paint: { "line-color": "#cf0031", "line-width": 4.2 }
            },
            {
              id: "via-sanitaria-flechas",
              source: "tsunami_vector",
              "source-layer": "via_sanitariageojson",
              type: "symbol",
              layout: {
                "symbol-placement": "line",
                "symbol-spacing": 80,
                "icon-image": "flecha_roja",
                "icon-size": 0.65,
                "icon-allow-overlap": true,
                "icon-ignore-placement": true
              }
            },

            // 13. ZONA_RECORTE ARRIBA DE LAS CAPAS VECTORIALES (Pinta de gris lo que queda afuera de la zona)
            {
              id: "zona-recorte-mascara",
              source: "tsunami_vector",
              "source-layer": "mascara_recortegeojson",
              type: "fill",
              paint: {
                "fill-color": "#4a4a4a",
                "fill-opacity": 0.68
              }
            },
            {
              id: "zona-recorte-borde",
              source: "tsunami_vector",
              "source-layer": "zona_recortegeojson",
              type: "line",
              paint: {
                "line-color": "#d4d4d8",
                "line-width": 1.5,
                "line-opacity": 0.6
              }
            },

            // 14. Guía GPS en vivo
            {

      map.on('load', () => {
        const clickLayers = [
          'puntos-reunion-dc', 'puntos-reunion-escuelas', 'comando-puntos',
          'salud-publica-puntos', 'salud-privada-puntos', 'bomberos-puntos',
          'seguridad-puntos', 'vulnerable-puntos', 'escuelas-puntos', 'ciencia-puntos'
        ];

        clickLayers.forEach(lId => {
          map.on('click', lId, (e) => {
            const props = e.features[0].properties;
            const coords = e.features[0].geometry.coordinates.slice();
            const titulo = props.nam || props.nombre || props.Name || props.etiqueta || props.fna || 'Punto Operativo';
            const sub = props.descripcio || props.tipo || props.direccion || props.gna || '';
            new maplibregl.Popup()
              .setLngLat(coords)
              .setHTML(`<strong>${titulo}</strong>${sub ? `<br><span style="font-size:12px; color:#94a3b8;">${sub}</span>` : ''}`)
              .addTo(map);
          });
        });

        const geolocate = new maplibregl.GeolocateControl({
          positionOptions: { enableHighAccuracy: true },
          trackUserLocation: true,
          showUserHeading: true
        });
        map.addControl(geolocate, 'bottom-right');
        map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

        geolocate.on('geolocate', (pos) => {
          const userCoords = [pos.coords.longitude, pos.coords.latitude];
          const userPoint = turf.point(userCoords);
          gpsStatus.innerText = `GPS: ±${Math.round(pos.coords.accuracy)}m`;

          const featuresZonas = map.queryRenderedFeatures({ layers: ['area-evacuacion-colores'] });
          const featuresPuntos = map.queryRenderedFeatures({ layers: ['puntos-reunion-dc', 'puntos-reunion-escuelas'] });

          let nivelRiesgo = null;
          if (featuresZonas.length > 0) {
            for (const f of featuresZonas) {
              try {
                if (turf.booleanPointInPolygon(userPoint, f)) {
                  nivelRiesgo = f.properties.categoria || 'Alto';
                  break;
                }
              } catch(err) {}
            }
          }

          alertBox.style.display = 'block';

          if (nivelRiesgo === 'Alto') {
            alertBox.className = 'alert-banner alert-danger';
            alertBox.innerHTML = '⚠️ ALERTA MÁXIMA: SE ENCUENTRA EN ZONA DE INUNDACIÓN (COTA ALTA)';
          } else if (nivelRiesgo === 'Medio') {
            alertBox.className = 'alert-banner alert-warning';
            alertBox.innerHTML = '⚠️ PRECAUCIÓN: SE ENCUENTRA EN ZONA DE INUNDACIÓN (COTA MEDIA)';
          } else {
            alertBox.className = 'alert-banner alert-safe';
            alertBox.innerHTML = '✅ ZONA SEGURA (Sobre la cota de evacuación)';
            map.getSource('ruta_activa').setData(turf.featureCollection([]));
            return;
          }

          if (featuresPuntos.length > 0) {
            let destinoCercano = null;
            let minDist = Infinity;

            featuresPuntos.forEach(pt => {
              const dist = turf.distance(userPoint, pt, { units: 'meters' });
              if (dist < minDist) {
                minDist = dist;
                destinoCercano = pt;
              }
            });

            if (destinoCercano) {
              const nombreDestino = destinoCercano.properties.nam || destinoCercano.properties.Name || 'Zona Segura';
              alertBox.innerHTML += `<br><span style="font-size:11.5px; font-weight:normal;">Evacue hacia: <strong>${nombreDestino}</strong> (~${Math.round(minDist)}m)</span>`;
              const lineaGuia = turf.lineString([userCoords, destinoCercano.geometry.coordinates]);
              map.getSource('ruta_activa').setData(turf.featureCollection([lineaGuia]));
            }
          }
        });
      });
    })();
  </script>
