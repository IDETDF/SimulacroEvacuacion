<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#dc2626" />
  <link rel="manifest" href="manifest.json" />
  <title>Simulacro de Evacuación</title>
  <link rel="stylesheet" href="lib/maplibre-gl.css" />
  <script src="lib/maplibre-gl.js"></script>
  <script src="lib/pmtiles.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; }

    /* Barra de estado superior */
    .top-bar {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .badge {
      pointer-events: auto; background: #dc2626; color: #ffffff;
      padding: 6px 14px; border-radius: 9999px; font-weight: 700;
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .status-pill {
      pointer-events: auto; background: rgba(15, 23, 42, 0.85);
      color: #94a3b8; padding: 6px 12px; border-radius: 9999px;
      font-size: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
    }

    /* Modal de carga inicial */
    #loader-overlay {
      position: absolute; inset: 0; z-index: 50;
      background: #0f172a; display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 24px; text-align: center;
    }
    .card {
      background: #1e293b; border-radius: 16px; padding: 32px 24px;
      max-width: 420px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    .card h1 { color: #f8fafc; font-size: 20px; margin-bottom: 8px; font-weight: 700; }
    .card p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    
    .file-btn {
      display: inline-block; width: 100%; padding: 14px 20px;
      background: #2563eb; color: #ffffff; font-weight: 600; font-size: 15px;
      border-radius: 10px; cursor: pointer; transition: background 0.2s; border: none;
    }
    .file-btn:active { background: #1d4ed8; }

    .btn-install {
      background: #16a34a; margin-bottom: 12px; display: none;
    }
    .btn-install:active { background: #15803d; }

    input[type="file"] { display: none; }
    .offline-tip {
      margin-top: 16px; font-size: 12px; color: #64748b; line-height: 1.4;
    }

    /* Controles de mapa */
    .maplibregl-ctrl-group {
      border-radius: 10px !important; overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3) !important;
    }
  </style>
</head>
<body>

  <!-- Overlay para cargar el archivo PMTiles e instalar -->
  <div id="loader-overlay">
    <div class="card">
      <div style="font-size: 40px; margin-bottom: 12px;">🗺️</div>
      <h1>Simulacro de Evacuación</h1>
      <p>Para operar en modo 100% offline, instala la app en tu teléfono y selecciona la cartografía <strong>.pmtiles</strong>.</p>
      
      <!-- Botón de instalación PWA -->
      <button id="btn-install" class="file-btn btn-install">
        📲 Instalar App en el Teléfono
      </button>

      <label class="file-btn">
        Seleccionar cartografía (.pmtiles)
        <input type="file" id="pmtiles-file" accept=".pmtiles" />
      </label>

      <div class="offline-tip">
        Los datos se procesan localmente en memoria. No se requiere conexión a internet ni datos móviles.
      </div>
    </div>
  </div>

  <!-- Barra informativa superior -->
  <div class="top-bar">
    <div class="badge">Simulacro de Evacuación</div>
    <div class="status-pill" id="file-name-tag">Esperando datos</div>
  </div>

  <div id="map"></div>

  <script>
    // 1. Manejo del ciclo de vida del Service Worker y actualización
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update(); // Fuerza al navegador a verificar cambios en sw.js
        }).catch(err => {
          console.warn('SW registration skipped:', err);
        });
      });
    }

    // 2. Lógica para capturar el banner de instalación PWA
    let deferredPrompt = null;
    const btnInstall = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'block';
    });

    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        btnInstall.style.display = 'none';
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      btnInstall.style.display = 'none';
      deferredPrompt = null;
    });

    // 3. Manejo de cartografía PMTiles
    let map = null;
    const fileInput = document.getElementById('pmtiles-file');
    const overlay = document.getElementById('loader-overlay');
    const statusTag = document.getElementById('file-name-tag');

    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      statusTag.innerText = file.name;
      overlay.style.display = 'none';

      const fileSource = new pmtiles.FileSource(file);
      const p = new pmtiles.PMTiles(fileSource);

      const header = await p.getHeader();
      const metadata = await p.getMetadata();

      const protocol = new pmtiles.Protocol();
      protocol.add(p);
      maplibregl.addProtocol('pmtiles', protocol.tile);

      const startCenter = [header.centerLon || 0, header.centerLat || 0];
      const startZoom = header.centerZoom || header.minZoom || 13;

      map = new maplibregl.Map({
        container: 'map',
        center: startCenter,
        zoom: startZoom,
        minZoom: header.minZoom || 0,
        maxZoom: 20,
        style: {
          version: 8,
          sources: {
            'evacuacion_source': {
              type: 'vector',
              url: `pmtiles://${file.name}`,
              attribution: 'Cartografía Operativa Local'
            }
          },
          layers: [
            {
              id: 'background',
              type: 'background',
              paint: { 'background-color': '#0f172a' }
            }
          ]
        }
      });

      map.on('load', () => {
        let vectorLayers = [];
        if (metadata && metadata.vector_layers) {
          vectorLayers = metadata.vector_layers;
        }

        if (vectorLayers.length > 0) {
          vectorLayers.forEach((vl) => {
            const layerId = vl.id.toLowerCase();

            map.addLayer({
              id: `fill-${vl.id}`,
              source: 'evacuacion_source',
              'source-layer': vl.id,
              type: 'fill',
              filter: ['==', ['geometry-type'], 'Polygon'],
              paint: {
                'fill-color': layerId.includes('segur') || layerId.includes('reunion') ? '#16a34a' : '#1e293b',
                'fill-opacity': layerId.includes('segur') ? 0.35 : 0.7,
                'fill-outline-color': '#475569'
              }
            });

            map.addLayer({
              id: `line-${vl.id}`,
              source: 'evacuacion_source',
              'source-layer': vl.id,
              type: 'line',
              filter: ['==', ['geometry-type'], 'LineString'],
              paint: {
                'line-color': layerId.includes('evac') || layerId.includes('ruta') ? '#ef4444' : '#64748b',
                'line-width': layerId.includes('evac') || layerId.includes('ruta') ? 4 : 1.5,
                'line-opacity': 0.9
              }
            });

            map.addLayer({
              id: `circle-${vl.id}`,
              source: 'evacuacion_source',
              'source-layer': vl.id,
              type: 'circle',
              filter: ['==', ['geometry-type'], 'Point'],
              paint: {
                'circle-radius': 7,
                'circle-color': layerId.includes('comando') || layerId.includes('puesto') ? '#f59e0b' : '#2563eb',
                'circle-stroke-width': 2,
                'circle-stroke-color': '#ffffff'
              }
            });
          });
        }

        const geolocate = new maplibregl.GeolocateControl({
          positionOptions: { enableHighAccuracy: true },
          trackUserLocation: true,
          showUserHeading: true
        });
        map.addControl(geolocate, 'bottom-right');
        map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'bottom-right');
      });
    });
  </script>
</body>
</html>
